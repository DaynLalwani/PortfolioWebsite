<!DOCTYPE html>
<html>
<head>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: #111; display: flex; flex-direction: column; height: 100vh; overflow: hidden; font-family: monospace; }
  video { flex: 1; width: 100%; min-height: 0; object-fit: contain; background: #111; }
  #controls { padding: 8px 16px; background: #1a1a1a; display: flex; align-items: center; gap: 12px; flex-shrink: 0; }
  #label { color: #fff; font-size: 14px; }
  select { background: #333; color: #fff; border: 1px solid #444; padding: 6px 10px; font-family: monospace; font-size: 13px; border-radius: 4px; cursor: pointer; }
</style>
</head>
<body>
<video id="vid" src="" muted playsinline autoplay loop></video>
<div id="controls">
  <select id="picker"></select>
  <span id="label"></span>
</div>
<script>
  const videos = [
    { name: "No Nose , 1x Speed", url: "https://raw.githubusercontent.com/DaynLalwani/PlainSimulations/main/Nose/1x60.mp4" },
    { name: "No Nose , 0.5x Speed", url: "https://raw.githubusercontent.com/DaynLalwani/PlainSimulations/main/Nose/1x30.mp4" },
    { name: "Sharp, 1x Speed", url: "https://raw.githubusercontent.com/DaynLalwani/PlainSimulations/main/Nose/2x60.mp4" },
    { name: "Sharp , 0.5x Speed", url: "https://raw.githubusercontent.com/DaynLalwani/PlainSimulations/main/Nose/2x30.mp4" },
    { name: "Circular , 1x Speed", url: "https://raw.githubusercontent.com/DaynLalwani/PlainSimulations/main/Nose/3x60.mp4" },
    { name: "Circular , 0.5x Speed", url: "https://raw.githubusercontent.com/DaynLalwani/PlainSimulations/main/Nose/3x30.mp4" },
    { name: "Rounded Sharp , 1x Speed", url: "https://raw.githubusercontent.com/DaynLalwani/PlainSimulations/main/Nose/4x60.mp4" },
    { name: "Rounded Sharp , 0.5x Speed", url: "https://raw.githubusercontent.com/DaynLalwani/PlainSimulations/main/Nose/4x30.mp4" },
  ];
  const vid    = document.getElementById('vid');
  const picker = document.getElementById('picker');
  const label  = document.getElementById('label');
  videos.forEach((v, i) => {
    const opt = document.createElement('option');
    opt.value = i;
    opt.textContent = v.name;
    picker.appendChild(opt);
  });
  function load(i) {
    vid.src = videos[i].url;
    label.textContent = videos[i].name;
    vid.play();
  }
  picker.addEventListener('change', () => load(parseInt(picker.value)));
  load(0);
</script>
</body>
</html>
