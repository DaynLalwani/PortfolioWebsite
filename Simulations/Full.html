<!DOCTYPE html>
<html>
<head>

  
<style>
  body { margin: 0; background: #111; display: flex; flex-direction: column; height: 100vh; font-family: monospace; }
  model-viewer { flex: 1; width: 100%; background: #111; }
  #controls { padding: 12px 16px; background: #1a1a1a; display: flex; align-items: center; gap: 12px; }
  #slider { flex: 1; }
  #label { color: #fff; font-size: 13px; min-width: 90px; }

  #flipBtn {
    background: #222;
    color: #aaa;
    border: 1px solid #444;
    border-radius: 4px;
    padding: 4px 8px;
    font-family: monospace;
    font-size: 12px;
    cursor: pointer;
    white-space: nowrap;
    transition: background 0.15s, color 0.15s;
  }
  #flipBtn:hover { background: #333; color: #fff; }
  #flipBtn.active { background: #2a2a2a; color: #fff; border-color: #666; }
</style>
<script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
</head>
<body>

<model-viewer
  id="mv"
  src="https://raw.githubusercontent.com/DaynLalwani/PlainSimulations/main/ZFullBake/frame_0000.glb"
  camera-controls
  interaction-prompt="none"
  shadow-intensity="0"
  orientation="0deg -90deg 0deg"
  exposure="1"
  style="--progress-bar-color: transparent;">
</model-viewer>

<div id="controls">
  <button id="flipBtn">Z/Y flip</button>
  <span style="color:#aaa">Frame</span>
  <input type="range" id="slider" min="0" max="59" value="0">
  <span id="label">0000 / 0449</span>
</div>

<script>
  const mv      = document.getElementById('mv');
  const slider  = document.getElementById('slider');
  const label   = document.getElementById('label');
  const flipBtn = document.getElementById('flipBtn');

  const REPOS = {
    Z: 'https://raw.githubusercontent.com/DaynLalwani/PlainSimulations/main/ZFullBake/frame_',
    Y: 'https://raw.githubusercontent.com/DaynLalwani/PlainSimulations/main/YFullBake/frame_',
  };

  let currentAxis = 'Z';

  function pad(n) { return String(n).padStart(4, '0'); }

  flipBtn.addEventListener('click', () => {
    currentAxis = currentAxis === 'Z' ? 'Y' : 'Z';
    flipBtn.classList.toggle('active', currentAxis === 'Y');
    flipBtn.textContent = currentAxis === 'Z' ? 'Y flip' : 'Z flip';
    const n = parseInt(slider.value);
    mv.src = REPOS[currentAxis] + pad(n) + '.glb';
  });

  let debounce = null;
  slider.addEventListener('input', () => {
    const n = parseInt(slider.value);
    label.textContent = pad(n) + ' / 0059';
    clearTimeout(debounce);
    debounce = setTimeout(() => {
      mv.src = REPOS[currentAxis] + pad(n) + '.glb';
    }, 150);
  });
</script>
</body>
</html>
